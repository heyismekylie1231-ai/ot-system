<script>
function exportOTLogsToExcel() {
    // 自动寻找页面上的表格（支持 HR Live Data Monitor 或 All Submitted OT Logs 表格）
    const table = document.querySelector("#hrLiveTable tbody") || document.querySelector("table");
    if (!table) {
        alert("找不到表格数据！");
        return;
    }

    let csvContent = "\uFEFF"; 
    const headers = [
        "Dept / 部门", "Name / 姓名", "Emp ID / 工号", "Date / 日期", 
        "Start Time / 开始时间", "End Time / 结束时间", "Total Hours / 总时数", 
        "Purpose & Reason / 原因用途", "Status / 状态"
    ];
    csvContent += headers.join(",") + "\r\n";

    const rows = table.querySelectorAll("tr");
    rows.forEach(row => {
        const cols = row.querySelectorAll("td");
        if (cols.length >= 8) {
            let rowData = [];
            for (let i = 0; i < 8; i++) {
                let text = cols[i] ? cols[i].innerText.trim().replace(/"/g, '""') : "";
                rowData.push(`"${text}"`);
            }
            csvContent += rowData.join(",") + "\r\n";
        }
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    const timestamp = new Date().toISOString().slice(0, 10);
    link.setAttribute("download", `Kaizen_OT_Records_${timestamp}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>
